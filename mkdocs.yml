site_name: Build Your Agents 101
site_description: Learn to build AI agents from scratch - A hands-on tutorial series
site_author: Chidam Gopal
site_url: https://yourusername.github.io/buildAgents

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Tutorial:
    - Stage 1 - Database Setup: tutorial/stage1-database.md
    - Stage 2 - Basic Agent: tutorial/stage2-basic-agent.md
    - Stage 3 - LangChain Version: tutorial/stage3-langchain.md
  - Concepts:
    - What is ReAct?: concepts/react-pattern.md
    - Function Calling: concepts/function-calling.md
  - About: about.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/buildAgents